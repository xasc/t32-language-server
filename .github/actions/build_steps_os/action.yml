name: 'build_steps_os'
description: 'Build steps for OS builds'

inputs:
  profile:
    required: true
    type: string
    default: ''

runs:
  using: "composite"
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable

    - uses: actions/download-artifact@v8.0.2
      with:
        name: ugd.dat
        path: data/

    - name: Build language server
      run: cargo build --verbose --bin t32ls --profile ${{ inputs.profile }}
      shell: bash
