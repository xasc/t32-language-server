name: Publish language server crate

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

  # Workflow can be triggered manually
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  publish_t32ls_crate:
    name: Publish language server crate
    runs-on: ubuntu-latest
    environment: trusted-publish-crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build language server
        run: cargo build --verbose --bin t32ls

      - name: Run tests
        run: cargo test --verbose --package t32-language-server

      - name: Authenticate for trusted publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6

      - name: Publish crate dry run
        run: cargo publish --dry-run --package t32-language-server --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish crate
        run: cargo publish --package t32-language-server --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
