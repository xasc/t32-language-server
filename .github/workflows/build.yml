name: Build & test language server

on:
  push:
    paths:
      - 'ls/**'

  # Workflow can be triggered manually
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  import_data:
    name: Import data assets
    uses: ./.github/workflows/build_data.yml
    with:
      runner: ubuntu-latest
      profile: release
    permissions:
      contents: write
      id-token: write
      attestations: write

  build_and_test_t32ls_os:
    name: Build and test OS binary
    strategy:
      matrix:
        os: [macos-latest, macos-26-intel, ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    uses: ./.github/workflows/build_os.yml
    with:
      runner: ${{ matrix.os }}
      profile: release

  build_t32ls_wasm:
    name: Build WebAssembly binary
    uses: ./.github/workflows/build_wasm.yml
    with:
      profile: release
      wasi-version: 32
      wasi-os: linux
      wasi-arch: x86_64

  latest_deps_t32ls:
    name: Check compatibility with dependencies
    needs: import_data
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - name: Set up repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Upgrade dependencies
        run: cargo update --verbose

      - name: Build language server
        run: cargo build --verbose --bin t32ls

      - name: Run tests
        run: cargo test --verbose --package t32-language-server

  msrv:
    name: Check Rust version
    needs: import_data
    runs-on: ubuntu-latest
    steps:
      - name: Set up repository
        uses: actions/checkout@v7.0.1

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2.87.15
        with:
          tool: cargo-hack

      - name: Validate minimum Rust version
        run: cargo hack check --rust-version --workspace --all-targets --ignore-private
